services:
  # Database Service: PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: task_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-taskdb}
      POSTGRES_USER: ${DB_USER:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskuser} -d ${DB_NAME:-taskdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service: Node.js + Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskdb}
      DB_USER: ${DB_USER:-taskuser}
      DB_PASSWORD: ${DB_PASSWORD:-taskpassword}
      JWT_SECRET: ${JWT_SECRET:-devops_assignment_jwt_secret_key_2026}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Service: React (Vite) + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_frontend_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
